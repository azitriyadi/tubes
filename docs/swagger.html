<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRecycle API Docs</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
        :root {
            --eco-primary: #005641;
            --eco-accent: #16c784;
            --eco-ink: #102033;
            --eco-bg: #f4f8f7;
        }

        body {
            margin: 0;
            background: var(--eco-bg);
            color: var(--eco-ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .swagger-shell {
            min-height: 100vh;
        }

        .swagger-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 24px 40px;
            background: linear-gradient(135deg, #003f31 0%, #005641 100%);
            color: #fff;
            border-bottom: 4px solid var(--eco-accent);
        }

        .swagger-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .swagger-logo {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(22, 199, 132, 0.16);
            color: var(--eco-accent);
            font-weight: 900;
            font-size: 22px;
        }

        .swagger-title h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.2;
        }

        .swagger-title p {
            margin: 5px 0 0;
            color: rgba(255, 255, 255, 0.72);
            font-size: 14px;
        }

        .swagger-link {
            color: #fff;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 700;
            font-size: 14px;
        }

        .swagger-link:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        #swagger-ui {
            max-width: 1240px;
            margin: 0 auto;
            padding: 28px 20px 56px;
        }

        .swagger-ui .topbar {
            display: none;
        }

        .swagger-ui .info {
            margin: 18px 0 28px;
        }

        .swagger-ui .info .title {
            color: var(--eco-primary);
        }

        .swagger-ui .scheme-container {
            border-radius: 12px;
            box-shadow: 0 10px 28px rgba(16, 32, 51, 0.08);
        }

        .swagger-ui .opblock {
            border-radius: 12px;
            overflow: hidden;
        }

        @media (max-width: 720px) {
            .swagger-header {
                align-items: flex-start;
                flex-direction: column;
                padding: 22px;
            }
        }
    </style>
</head>
<body>
    <main class="swagger-shell">
        <header class="swagger-header">
            <div class="swagger-brand">
                <div class="swagger-logo">ER</div>
                <div class="swagger-title">
                    <h1>EcoRecycle API Docs</h1>
                    <p>Dokumentasi dan testing REST API. File ini terpisah dari aplikasi utama.</p>
                </div>
            </div>
            <a class="swagger-link" href="./openapi.json">OpenAPI JSON</a>
        </header>
        <section id="swagger-ui"></section>
    </main>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
        window.addEventListener('load', function () {
            const specUrl = window.location.protocol === 'file:' ? './openapi.json' : '/swagger/openapi.json';
            window.ui = SwaggerUIBundle({
                url: specUrl,
                dom_id: '#swagger-ui',
                deepLinking: true,
                docExpansion: 'list',
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1,
                displayRequestDuration: true,
                persistAuthorization: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                layout: 'BaseLayout'
            });
        });
    </script>
</body>
</html>
